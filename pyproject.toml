# Makes src/credit_risk an installable package, so `from credit_risk... import ...`
# works from notebooks and tests. Dependencies live in environment.yml.
[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit card default prediction as a modular, reproducible ML pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
credit-risk = "credit_risk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
