# Shared settings for every stage. Paths are relative to the project root.
paths:
  raw: data/raw/UCI_Credit_Card.csv
  processed_dir: data/processed
  reports_dir: reports
  artifacts_dir: artifacts

# sha256 of the committed raw CSV; `make data` checks it.
raw_sha256: a0f0ab49d6326671d6cd83be5c88dcf18007025fe9a53ecd699119c871176ca1

seed: 573
test_size: 0.2
cv_folds: 5

# Cost of each error type, used to choose the decision threshold (`make train`).
# Chosen 2026-10-11: a missed defaulter costs 5 times a false alarm, the ratio in the
# documented cost matrix of the Statlog (German Credit) dataset, a common reference for
# credit scoring. make decide also reports 3:1 and 10:1 to show how the choice moves.
costs:
  false_negative: 5.0   # missed defaulter
  false_positive: 1.0   # false alarm on a client who would have paid

# Setups compared by `make experiments`, all on the same CV folds.
# model: a name from credit_risk.models; params: passed to that model;
# sampler (optional): a name from credit_risk.samplers, applied to training folds only.
# features (optional): a list of groups from credit_risk.features.
experiments:
  # M2: each model family at library defaults.
  - {name: dummy, model: dummy}
  - {name: logreg, model: logreg}
  - {name: forest, model: forest}
  - {name: lgbm, model: lgbm}
  - {name: xgboost, model: xgboost}
  # M3: three ways to handle the 78% / 22% class split, each on logreg and lgbm.
  # class_weight: balanced counts an error on a defaulter about 3.5 times (78/22)
  # as much in the training loss. (XGBoost ignores class_weight and would need
  # scale_pos_weight instead, one reason xgboost is not in this group.)
  - {name: logreg_weighted, model: logreg, params: {class_weight: balanced}}
  - {name: logreg_undersample, model: logreg, sampler: undersample}
  - {name: logreg_smotenc, model: logreg, sampler: smotenc}
  - {name: lgbm_weighted, model: lgbm, params: {class_weight: balanced}}
  - {name: lgbm_undersample, model: lgbm, sampler: undersample}
  - {name: lgbm_smotenc, model: lgbm, sampler: smotenc}
  # M4: engineered features (src/credit_risk/features.py), each group alone and all
  # four together, on the class-weighted models from M3. Compare each row with
  # logreg_weighted or lgbm_weighted above, which see only the raw columns.
  - {name: logreg_weighted_delinquency, model: logreg, params: {class_weight: balanced}, features: [delinquency]}
  - {name: logreg_weighted_payment, model: logreg, params: {class_weight: balanced}, features: [payment]}
  - {name: logreg_weighted_utilization, model: logreg, params: {class_weight: balanced}, features: [utilization]}
  - {name: logreg_weighted_trend, model: logreg, params: {class_weight: balanced}, features: [trend]}
  - {name: logreg_weighted_allfeatures, model: logreg, params: {class_weight: balanced}, features: [delinquency, payment, utilization, trend]}
  - {name: lgbm_weighted_delinquency, model: lgbm, params: {class_weight: balanced}, features: [delinquency]}
  - {name: lgbm_weighted_payment, model: lgbm, params: {class_weight: balanced}, features: [payment]}
  - {name: lgbm_weighted_utilization, model: lgbm, params: {class_weight: balanced}, features: [utilization]}
  - {name: lgbm_weighted_trend, model: lgbm, params: {class_weight: balanced}, features: [trend]}
  - {name: lgbm_weighted_allfeatures, model: lgbm, params: {class_weight: balanced}, features: [delinquency, payment, utilization, trend]}

# M5: what `make decide` compares. Each candidate (a name from the experiments list) is
# calibrated with each method and given the cutoff with the lowest expected cost, once
# for each cost of a missed defaulter below. A false alarm stays at costs.false_positive.
decision:
  candidates: [lgbm, lgbm_weighted, logreg_weighted_allfeatures]
  calibration: [sigmoid, isotonic]
  false_negative_costs: [3, 5, 10]

# M5: the one setup `make train` fits on all of train and saves, with the costs above.
# Chosen 2026-10-11 from reports/tables/decision.csv: lowest expected cost at 3:1 and
# 5:1, and no class weights needed once the threshold is tuned.
final:
  experiment: lgbm
  calibration: sigmoid
