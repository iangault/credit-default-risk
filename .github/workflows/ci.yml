name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env is active in every step
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: credit-risk
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Smoke run of the pipeline
        run: make smoke
