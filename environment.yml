# Conda environment for the project.
# Create it once with `make setup` (or `conda env create -f environment.yml`),
# then `conda activate credit-risk` before running make targets.
name: credit-risk
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=2.2
  - pyyaml>=6.0
  - scikit-learn>=1.5
  - imbalanced-learn>=0.12   # resamplers (SMOTE, SMOTENC, undersampling) and a Pipeline that runs them only during fit
  - pyarrow>=15
  - lightgbm>=4
  - xgboost>=2
  - shap>=0.50             # SHAP explanations of the final model (make explain)
  - matplotlib-base>=3.8   # draws the SHAP plots; the other charts use altair
  - jupyterlab>=4
  - altair>=5
  # vegafusion pre-aggregates chart data in Python so notebooks don't embed raw rows;
  # it needs vl-convert. 2.x was only a release candidate when added.
  - vegafusion>=2
  - vl-convert-python>=1.6,<2
  # dev tools
  - pytest>=8.0
  - ruff>=0.6
  - pre-commit>=3.7
  - pip
  - pip:
      - altair_ally   # EDA helpers (aly.dist, aly.corr); not on conda-forge
      - -e .   # install this repo's src/credit_risk package in editable mode
